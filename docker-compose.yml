services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    volumes:
      # 키가 없을 때 쓰는 가짜 진행기(graph/fake.py)와 임시 질문이 읽는 mock. 키가 있어도 질문은 이 파일에서 읽으므로 유지한다
      - ./shared/mock:/srv/shared/mock:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports:
      - "8080:80"
    depends_on:
      - backend
